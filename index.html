
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obey the Command</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="timer">30</div>
    <div id="command">TAP! CIRCLE! NOW!</div>
    <div id="shapes">
      <div class="shape circle" data-shape="CIRCLE"></div>
      <div class="shape square" data-shape="SQUARE"></div>
      <div class="shape triangle" data-shape="TRIANGLE"></div>
    </div>
  </div>
  <audio id="bg-music" src="background_music.mp3" autoplay loop></audio>
  <script src="main.js"></script>
</body>
</html>
